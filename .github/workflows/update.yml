name: Mise à jour quotidienne
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les vidéos du jour
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: https://videos-du-jour-fr.netlify.app/
        run: python update.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json index.html sitemap.xml
          git diff --staged --quiet || git commit -m "Mise à jour des vidéos du jour"
          git push
